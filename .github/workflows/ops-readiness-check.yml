name: Ops Readiness Check

# Polls production /api/ops-readiness and opens an issue when monetization or push
# env is incomplete. Does not block merges — operational visibility only.

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: ops-readiness-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch production ops-readiness
        id: readiness
        env:
          OPS_READINESS_URL: https://hoopsintel.net/api/ops-readiness
        run: |
          # Fail closed: a bad fetch, empty body, or any secret-flag false
          # must never look like "no gaps" (that wrongly completed issue 129).
          echo "has_gaps=true" >> "$GITHUB_OUTPUT"
          body=$(curl -fsSL --max-time 15 "$OPS_READINESS_URL") || {
            echo "::warning::ops-readiness fetch failed — leaving issues open"
            exit 0
          }
          if missing=$(echo "$body" | node scripts/lib/ops-readiness.cjs); then
            echo "has_gaps=false" >> "$GITHUB_OUTPUT"
            echo "Production ops-readiness OK"
          else
            echo "has_gaps=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Production ops gaps: $missing"
          fi

      - name: Close ops-readiness issues once gaps clear
        if: steps.readiness.outputs.has_gaps == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const alerts = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/alert-issues.cjs`);
            const { evaluateOpsReadiness } = require(`${process.env.GITHUB_WORKSPACE}/scripts/lib/ops-readiness.cjs`);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let payload;
            try {
              const res = await fetch('https://hoopsintel.net/api/ops-readiness');
              payload = await res.json();
            } catch (err) {
              core.warning(`Refusing to close ops-readiness issues: refetch failed (${err.message || err})`);
              return;
            }
            const verdict = evaluateOpsReadiness(payload);
            if (!verdict.ready) {
              core.warning(`Refusing to close ops-readiness issues while gaps remain: ${verdict.gaps.join(', ')}`);
              return;
            }
            await alerts.closeResolvedIssues(github, context, core, {
              label: 'ops-readiness',
              titlePrefix: 'Ops readiness gaps',
              note: `Production ops-readiness reports no gaps in ${runUrl}. Auto-closing.`,
            });

      - name: Open issue when production env gaps remain
        if: steps.readiness.outputs.has_gaps == 'true'
        uses: actions/github-script@v9
        env:
          ALERT_ASSIGNEE: ${{ vars.ALERT_ASSIGNEE || github.repository_owner }}
        with:
          script: |
            const alerts = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/alert-issues.cjs`);
            const today = new Date().toISOString().slice(0, 10);
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ops-readiness',
              per_page: 100,
            });
            // Gaps persist until secrets land, so one open tracker is enough —
            // match on the prefix rather than today's exact title.
            if (open.data.some((i) => i.title.startsWith('Ops readiness gaps'))) {
              core.notice('Ops readiness issue already open — skip');
              return;
            }
            await alerts.openFailureIssue(github, context, core, {
              label: 'ops-readiness',
              title: `Ops readiness gaps — ${today}`,
              body: `## Production env gaps\n\n**Date:** ${today}\n**Check:** https://hoopsintel.net/api/ops-readiness\n**Workflow:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nRun \`vercel env pull\` and \`npm run ops:preflight:strict\` locally. See \`PRODUCTION-OPS.md\` for the full checklist.`,
            });
