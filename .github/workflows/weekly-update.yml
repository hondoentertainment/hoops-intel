name: Weekly Data Update

on:
  schedule:
    # Monday 6:00 AM PST (UTC-8) = 14:00 UTC
    - cron: "0 14 * * 1"
  workflow_dispatch: # allow manual trigger from GitHub Actions UI
  # Out-of-band regeneration without Actions UI access: bump the marker file
  # on main (e.g. via a merged PR) and the workflow fires. The generated
  # content commits never touch the marker, so runs don't self-trigger.
  push:
    branches: [main]
    paths: [".github/weekly-regen-request"]

concurrency:
  group: weekly-edition
  cancel-in-progress: false

jobs:
  check-season:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.season.outputs.active }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check NBA season status (season-mode.mjs)
        id: season
        run: |
          ACTIVE=$(node scripts/check-generator-active.mjs)
          echo "active=$ACTIVE" >> $GITHUB_OUTPUT
          echo "generatorActive=$ACTIVE"

      - name: Scheduled run — generator inactive (offseason)
        if: github.event_name == 'schedule' && steps.season.outputs.active != 'true'
        run: |
          echo "::notice::Weekly generator skipped — season-mode reports inactive."

  generate-weekly:
    needs: check-season
    if: needs.check-season.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run optimized weekly generation
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          node scripts/generate-all-weekly.mjs 2>&1 | tee generation.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          if [ "$exit_code" -eq 1 ]; then
            echo "Critical failure — aborting"
            exit 1
          elif [ "$exit_code" -eq 2 ]; then
            echo "Partial failure — refusing to commit"
            exit 1
          fi
        timeout-minutes: 15

      - name: Stage weekly data files
        run: node scripts/stage-weekly-edition.mjs

      - name: Check for changes
        id: changes
        run: |
          git diff --staged --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Pre-push CI gate (schema + build)
        if: steps.changes.outputs.changed == 'true'
        run: npm run test:pre-push

      - name: Commit and push weekly data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "hoops-intel-bot"
          git config user.email "bot@hoopsintel.net"
          git commit -m "Weekly update: $(date +'%B %-d, %Y' --date='TZ="America/Los_Angeles" now')"
          git push origin ${{ github.ref_name }}

      - name: Post-push note
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "::notice::Weekly data pushed — deployment-smoke will verify production."

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: echo "No data changes — skipping commit."

      - name: Close resolved weekly-failure issues
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const alerts = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/alert-issues.cjs`);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await alerts.closeResolvedIssues(github, context, core, {
              label: 'generation-failure',
              titlePrefix: 'Weekly generation failed',
              note: `Weekly generation succeeded in ${runUrl}. Auto-closing this stale failure report.`,
            });

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v9
        env:
          ALERT_ASSIGNEE: ${{ vars.ALERT_ASSIGNEE || github.repository_owner }}
        with:
          script: |
            const alerts = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/alert-issues.cjs`);
            const today = new Date().toISOString().slice(0, 10);
            await alerts.openFailureIssue(github, context, core, {
              label: 'generation-failure',
              title: `Weekly generation failed — ${today}`,
              body: `## Weekly Generation Failure\n\n**Date:** ${today}\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck the workflow logs for details.\n\nThis issue was auto-created by the weekly-update workflow.`,
            });
